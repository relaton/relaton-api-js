name: ingest

# The v2 producer is the one ingestion path: it walks the flavor's Pages
# machine index, renders the wave as SQLite literals, and loads them with
# `wrangler d1 execute --remote --file` (server-side batching - per-chunk
# POST transactions saturated D1's CPU window and the live read path
# 500'd under the sweep), then imports the reconciler (rows the wave
# never re-stamped are ghosts) and verifies the flavor row went fresh
# (the import-tail canary). The weekly schedule sweeps the fleet serially
# - parallel heavy legs still saturate D1; dataset push dispatches come
# per flavor from the relaton-data-* repos.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      v2_flavors:
        description: "Space-separated flavors to ingest into storage v2"
        type: string
        required: false
        default: ""
      limit:
        description: "Process at most N documents per flavor (shard size; empty = all)"
        type: string
        required: false
        default: ""
      v2_from_chunk:
        description: "Resume after this many chunks (chunk count to drain before posting)"
        type: string
        required: false
        default: ""
      reconcile_flavor:
        description: "Reconcile this flavor instead of ingesting (requires reconcile_before)"
        type: string
        required: false
        default: ""
      reconcile_before:
        description: "Reconcile cutoff: delete rows not re-stamped since this ISO timestamp"
        type: string
        required: false
        default: ""
  # relaton-data-* repos dispatch this on push (client_payload.flavor), so
  # dataset updates reach the API on their slice immediately instead of
  # waiting for the weekly sweep.
  repository_dispatch:
    types: [relaton-data-update]

jobs:
  reconcile-manual:
    if: github.event_name == 'workflow_dispatch' && inputs.reconcile_flavor != ''
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile flavor
        env:
          ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_TOKEN }}
          FLAVOR: ${{ inputs.reconcile_flavor }}
          BEFORE: ${{ inputs.reconcile_before }}
        run: |
          curl -sf -X POST "https://api.relaton.org/admin/reconcile-v2/$FLAVOR" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "content-type: application/json" \
            -d "{\"before\": \"$BEFORE\"}" | jq -c .

  matrix:
    # A manual-reconcile dispatch runs reconcile-manual only. The weekly
    # schedule and targeted dispatches drive the flavor matrix.
    if: github.event_name != 'repository_dispatch' && inputs.reconcile_flavor == ''
      && (github.event_name == 'schedule' || inputs.v2_flavors != '')
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.set.outputs.flavors }}
    steps:
      - id: set
        env:
          FLAVORS: ${{ inputs.v2_flavors }}
        run: |
          if [ -n "$FLAVORS" ]; then
            echo "flavors=$(echo "$FLAVORS" | jq -Rc 'split(" ") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          else
            # The weekly sweep walks the whole data fleet, named by the
            # fleet's own census: relaton/support's data-index/configs.yml
            # (the same file the Pages deploy and branding read). A repo
            # registered there joins the sweep with no workflow change -
            # fleet membership IS ingest membership. Each row's repo slug
            # names relaton-data-<repo>, whose Pages site carries the
            # machine index this workflow ingests.
            curl -sf https://raw.githubusercontent.com/relaton/support/main/data-index/configs.yml \
            | python3 -c 'import json, sys, yaml; print(json.dumps(sorted(row["repo"] for row in yaml.safe_load(sys.stdin)["repos"])))' \
            > flavors.json
            echo "flavors=$(cat flavors.json)" >> "$GITHUB_OUTPUT"
            cat flavors.json
          fi

  ingest-v2:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      # One lane for every ingestion run: dataset-push dispatches cluster
      # (a crawl wave lands several pushes together) and stacked imports
      # saturate D1 - the live read path 500s inside the windows
      # (D1_ERROR overload; contract checks 2026-11-13/14 and 11-15).
      # Queued, not cancelled - every flavor's wave still runs.
      group: ingest-d1
      cancel-in-progress: false
    strategy:
      fail-fast: false
      # One heavy producer walk at a time: parallel legs saturate D1.
      max-parallel: 1
      matrix:
        flavor: ${{ fromJSON(needs.matrix.outputs.flavors) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Clone the data repo for dataset reads
        run: git clone --depth 1 --single-branch "https://github.com/relaton/relaton-data-${{ matrix.flavor }}" data-clone
      - name: Dump the flavor's machine index to SQL
        id: dump
        env:
          LIMIT: ${{ inputs.limit }}
          FROM_CHUNK: ${{ inputs.v2_from_chunk }}
        run: |
          echo "before=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          args=""
          [ -n "$LIMIT" ] && args="$args --limit $LIMIT"
          [ -n "$FROM_CHUNK" ] && args="$args --from-chunk $FROM_CHUNK"
          node packages/relaton-api/bin/relaton-api.mjs ingest ${{ matrix.flavor }} \
            --v2 --dump-sql bulk-sql/ --data-clone data-clone $args
      # Imports, not chunked POSTs: d1 execute uploads the file and runs it
      # server-side with statement batching - per-chunk POST transactions
      # saturate D1's CPU window and the live read path 500s under the
      # sweep (D1_ERROR overload, contract checks 2026-11-13/14).
      - name: Import the data files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          flavor="${{ matrix.flavor }}"
          import_one() {
            f="$1"
            for attempt in 1 2 3; do
              echo "importing $f (attempt $attempt)"
              if npx wrangler@4 d1 execute api-relaton-org --remote --file="$f" --yes; then
                return 0
              fi
              echo "import of $f failed, waiting 60s before retry"
              sleep 60
            done
            echo "import of $f failed after 3 attempts"
            return 1
          }
          import_one "bulk-sql/${flavor}.sql"
          i=2
          while [ -f "bulk-sql/${flavor}-${i}.sql" ]; do
            import_one "bulk-sql/${flavor}-${i}.sql"
            i=$((i+1))
          done
      - name: Verify the flavor row is fresh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          flavor="${{ matrix.flavor }}"
          before="${{ steps.dump.outputs.before }}"
          indexed=$(npx wrangler@4 d1 execute api-relaton-org --remote \
            --command "SELECT indexed_at FROM flavors_v2 WHERE flavor='${flavor}'" \
            --json | jq -r '.[0].results[0].indexed_at')
          indexed_norm="${indexed%%.*}"
          case "$indexed_norm" in *Z) ;; *) indexed_norm="${indexed_norm}Z";; esac
          echo "indexed_at=$indexed (normalized $indexed_norm; wave started $before)"
          if [ -z "$indexed" ] || [ "$indexed" == "null" ] || [[ "$indexed_norm" < "$before" ]]; then
            echo "flavors_v2.indexed_at for ${flavor} is stale — the import tail was lost"
            exit 1
          fi
      # Only a full (unsharded) wave reconciles: a limited shard leaves the
      # rest of the flavor's rows un-stamped, and deleting them would be
      # worse than keeping the ghosts another cycle.
      - name: Import the reconciler
        if: inputs.limit == '' && inputs.v2_from_chunk == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          rec="bulk-sql/${{ matrix.flavor }}-reconcile.sql"
          for attempt in 1 2 3; do
            echo "importing $rec (attempt $attempt)"
            if npx wrangler@4 d1 execute api-relaton-org --remote --file="$rec" --yes; then
              exit 0
            fi
            echo "import of $rec failed, waiting 60s before retry"
            sleep 60
          done
          echo "import of $rec failed after 3 attempts"
          exit 1

  # One relaton-data-* slice, dispatched by that dataset's own push workflow.
  ingest-dispatch:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      # One lane for every ingestion run: dataset-push dispatches cluster
      # (a crawl wave lands several pushes together) and stacked imports
      # saturate D1 - the live read path 500s inside the windows
      # (D1_ERROR overload; contract checks 2026-11-13/14 and 11-15).
      # Queued, not cancelled - every flavor's wave still runs.
      group: ingest-d1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Clone the data repo for dataset reads
        env:
          FLAVOR: ${{ github.event.client_payload.flavor }}
        run: git clone --depth 1 --single-branch "https://github.com/relaton/relaton-data-$FLAVOR" data-clone
      - name: Dump the flavor's machine index to SQL
        id: dump
        env:
          FLAVOR: ${{ github.event.client_payload.flavor }}
        run: |
          echo "before=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          node packages/relaton-api/bin/relaton-api.mjs ingest "$FLAVOR" \
            --v2 --dump-sql bulk-sql/ --data-clone data-clone
      - name: Import the data files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLAVOR: ${{ github.event.client_payload.flavor }}
        run: |
          set -e
          flavor="$FLAVOR"
          import_one() {
            f="$1"
            for attempt in 1 2 3; do
              echo "importing $f (attempt $attempt)"
              if npx wrangler@4 d1 execute api-relaton-org --remote --file="$f" --yes; then
                return 0
              fi
              echo "import of $f failed, waiting 60s before retry"
              sleep 60
            done
            echo "import of $f failed after 3 attempts"
            return 1
          }
          import_one "bulk-sql/${flavor}.sql"
          i=2
          while [ -f "bulk-sql/${flavor}-${i}.sql" ]; do
            import_one "bulk-sql/${flavor}-${i}.sql"
            i=$((i+1))
          done
      - name: Verify the flavor row is fresh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLAVOR: ${{ github.event.client_payload.flavor }}
        run: |
          set -e
          flavor="$FLAVOR"
          before="${{ steps.dump.outputs.before }}"
          indexed=$(npx wrangler@4 d1 execute api-relaton-org --remote \
            --command "SELECT indexed_at FROM flavors_v2 WHERE flavor='${flavor}'" \
            --json | jq -r '.[0].results[0].indexed_at')
          indexed_norm="${indexed%%.*}"
          case "$indexed_norm" in *Z) ;; *) indexed_norm="${indexed_norm}Z";; esac
          echo "indexed_at=$indexed (normalized $indexed_norm; wave started $before)"
          if [ -z "$indexed" ] || [ "$indexed" == "null" ] || [[ "$indexed_norm" < "$before" ]]; then
            echo "flavors_v2.indexed_at for ${flavor} is stale — the import tail was lost"
            exit 1
          fi
      - name: Import the reconciler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLAVOR: ${{ github.event.client_payload.flavor }}
        run: |
          set -e
          rec="bulk-sql/$FLAVOR-reconcile.sql"
          for attempt in 1 2 3; do
            echo "importing $rec (attempt $attempt)"
            if npx wrangler@4 d1 execute api-relaton-org --remote --file="$rec" --yes; then
              exit 0
            fi
            echo "import of $rec failed, waiting 60s before retry"
            sleep 60
          done
          echo "import of $rec failed after 3 attempts"
          exit 1
