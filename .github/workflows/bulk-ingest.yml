name: bulk-ingest

# The bulk import path (relaton-api-js#137): walks the flavor's machine
# index with the same producer the POST path uses, but writes the ingest
# statements as SQLite literals and loads them with `wrangler d1 execute --remote --file` —
# server-side streaming batching, orders of magnitude cheaper per row than
# per-chunk D1 transactions. The reconciler for a full wave rides a
# separate file, imported last, so ghosts of a refreshed index are deleted
# only after the data landed.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor to bulk-load into storage v2"
        type: string
        required: true

permissions: {}

jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Clone the data repo for dataset reads
        # Datasets are committed in relaton-data-*; reading them off a local
        # clone removes the ~80k raw.githubusercontent fetches that rate
        # limits turned into silent walk losses (2026-11-12 iso).
        run: git clone --depth 1 --single-branch "https://github.com/relaton/relaton-data-${{ inputs.flavor }}" data-clone
      - name: Dump the flavor's machine index to SQL
        run: |
          node packages/relaton-api/bin/relaton-api.mjs ingest "${{ inputs.flavor }}" \
            --v2 --dump-sql bulk-sql/ --data-clone data-clone
      - name: Import the data files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Numeric order, never a glob: the dump rotates iso.sql, iso-2.sql,
        # ... and a lexicographic glob imports iso-10 first and iso.sql
        # last — child rows (doc_keys, projections) would land before their
        # documents_v2 parents and trip the FK constraint (2026-11-12 iso).
        run: |
          set -e
          flavor="${{ inputs.flavor }}"
          # d1 execute rolls back a failed execution and is safe to retry
          # (the API's own note); the 2026-11-12 iso leg lost its
          # reconciler to a transient 7009 upstream blip after every data
          # file had landed.
          import_one() {
            f="$1"
            for attempt in 1 2 3; do
              echo "importing $f (attempt $attempt)"
              if npx wrangler@4 d1 execute api-relaton-org --remote --file="$f" --yes; then
                return 0
              fi
              echo "import of $f failed, waiting 60s before retry"
              sleep 60
            done
            echo "import of $f failed after 3 attempts"
            return 1
          }
          import_one "bulk-sql/${flavor}.sql"
          i=2
          while [ -f "bulk-sql/${flavor}-${i}.sql" ]; do
            import_one "bulk-sql/${flavor}-${i}.sql"
            i=$((i+1))
          done
      - name: Import the reconciler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The 2026-11-12 iso legs lost the reconcile three times here: no
        # retry (the data-files step had it, this one never did) and no
        # index on (flavor, indexed_at) - every bounded round scanned the
        # whole flavor and the import gateway killed the file at ~60s.
        run: |
          set -e
          rec="bulk-sql/${{ inputs.flavor }}-reconcile.sql"
          for attempt in 1 2 3; do
            echo "importing $rec (attempt $attempt)"
            if npx wrangler@4 d1 execute api-relaton-org --remote --file="$rec" --yes; then
              exit 0
            fi
            echo "import of $rec failed, waiting 60s before retry"
            sleep 60
          done
          echo "import of $rec failed after 3 attempts"
          exit 1
