name: bulk-ingest

# The bulk import path (relaton-api-js#137): walks the flavor's machine
# index with the same producer the POST path uses, but writes the ingest
# statements as SQLite literals and loads them with `wrangler d1 execute --remote --file` —
# server-side streaming batching, orders of magnitude cheaper per row than
# per-chunk D1 transactions. The reconciler for a full wave rides a
# separate file, imported last, so ghosts of a refreshed index are deleted
# only after the data landed.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor to bulk-load into storage v2"
        type: string
        required: true

permissions: {}

jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Clone the data repo for dataset reads
        # Datasets are committed in relaton-data-*; reading them off a local
        # clone removes the ~80k raw.githubusercontent fetches that rate
        # limits turned into silent walk losses (2026-11-12 iso).
        run: git clone --depth 1 --single-branch "https://github.com/relaton/relaton-data-${{ inputs.flavor }}" data-clone
      - name: Dump the flavor's machine index to SQL
        run: |
          node packages/relaton-api/bin/relaton-api.mjs ingest "${{ inputs.flavor }}" \
            --v2 --dump-sql bulk-sql/ --data-clone data-clone
      - name: Import the data files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          for f in bulk-sql/${{ inputs.flavor }}*.sql; do
            case "$f" in *reconcile*) continue;; esac
            echo "importing $f"
            npx wrangler@4 d1 execute api-relaton-org --remote --file="$f" --yes
          done
      - name: Import the reconciler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 d1 execute api-relaton-org --remote --file="bulk-sql/${{ inputs.flavor }}-reconcile.sql" --yes
