name: backfill-status

on:
  workflow_dispatch:
    inputs:
      flavors:
        description: "Space-separated flavor list (defaults to all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - name: Run backfill
        env:
          ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_TOKEN }}
          FLAVORS: ${{ github.event.inputs.flavors || '3gpp adobe bipm calconnect ccsds cie easc ecma etsi gost iala iana iec ieee ietf iho iso itu itu-r jcgm jis nist oasis ogc oiml plateau rfcs rfcsubseries w3c xsf' }}
        run: tools/backfill_status.sh
