name: ingest

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      flavors:
        description: "Space-separated flavor list (defaults to all)"
        required: false
        default: ""

jobs:
  ingest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor:
          [3gpp, adobe, bipm, calconnect, ccsds, cie, easc, ecma, etsi,
           gost, iala, iana, iec, ieee, ietf, iho, iso, itu-r, itu, jcgm,
           jis, nist, oasis, ogc, oiml, plateau, rfcs, rfcsubseries, w3c, xsf]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: relaton/relaton-data-${{ matrix.flavor }}
          path: data/relaton-data-${{ matrix.flavor }}
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: tools
          ruby-version: "3.4"
          bundler-cache: false
      - name: Bundle install
        working-directory: tools
        env:
          RELATON_GEM: ${{ vars.RELATON_GEM }}
          PUBID_GEM: ${{ vars.PUBID_GEM }}
        run: bundle install
      - name: Build chunks
        working-directory: tools
        env:
          RELATON_GEM: ${{ vars.RELATON_GEM }}
          PUBID_GEM: ${{ vars.PUBID_GEM }}
        run: bundle exec ruby build_ingest.rb -r ../data/relaton-data-${{ matrix.flavor }} -f ${{ matrix.flavor }} -o out/${{ matrix.flavor }}
      - name: Post chunks
        env:
          ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_TOKEN }}
        run: tools/post_chunks.sh tools/out/${{ matrix.flavor }} https://api.relaton.org "$ADMIN_TOKEN"
