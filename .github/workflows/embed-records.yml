name: embed-records

# Builds the Vectorize semantic index: embeds every record (identifier +
# title + abstract) and upserts it into relaton-records. Hours-long run;
# resumable by cursor, safe to re-run (vectors upsert by document id).

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Records per page (default 100)"
        required: false
        default: "100"

permissions:
  contents: read

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - name: Run embedding walk
        env:
          ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_TOKEN }}
          LIMIT: ${{ github.event.inputs.limit || '100' }}
        run: tools/embed_records.sh
