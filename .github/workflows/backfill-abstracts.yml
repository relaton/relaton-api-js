name: backfill-abstracts

on:
  workflow_dispatch:
    inputs:
      flavors:
        description: "Space-separated flavor list (defaults to all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - name: Run backfill
        env:
          ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_TOKEN }}
          FLAVORS: "iso iec ietf itu nist ieee iho ogc w3c un gb jis bsi oasis 3gpp ccsds cie ecma iana oiml plateau xsf bipm calconnect easc gost sae doi isbn"
        run: tools/backfill_abstracts.sh
